[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "digsig"
dynamic = ["version"]
description = "Digital signature toolkit for Python"
readme = { text = "Digital signature toolkit for Python.", content-type = "text/plain" }
authors = [
    { name = "Rodrigo Martínez", email = "dev@brunneis.com" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    # Upper bound: verified up to this major; widen it only after
    # re-running the suite against the new line.
    "cryptography>=3.4.4,<51.0.0",
    # Both eth-account lines are supported: 0.5.x (shipped stacks) and
    # >= 0.6 (public-API-only code paths, no private imports).
    "eth-account>=0.5.4,<1.0.0",
    "pycryptodome>=3.4.7,<4.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/labteral/digsig"

[tool.pytest.ini_options]
# Warnings emitted by third-party dependencies that digsig intentionally
# supports, not by digsig itself: eth-account 0.5.x uses
# collections.abc.ByteString (deprecated in python 3.12), eth_keyfile needs
# pkg_resources (a DeprecationWarning under setuptools<80; hidden by python
# defaults but shown by pytest) and eth-utils imports toolz.compatibility.
filterwarnings = [
    "ignore:'collections.abc.ByteString' is deprecated:DeprecationWarning",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore:The toolz.compatibility module is no longer needed:DeprecationWarning",
]

[tool.setuptools]
packages = ["digsig"]
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "digsig.__version__" }
